
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Events</title>

    <style>
        #box {
            width: 300px;
            padding: 40px;
            margin: 50px auto;
            text-align: center;
            background-color: lightblue;
            border-radius: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Mouseover and Mouseout</h2>

    <div id="box">Move your mouse here!</div>

    <script>
        const box = document.getElementById("box");

        box.addEventListener("mouseover", () => {
            box.textContent = "Mouse is over me!";
            box.style.backgroundColor = "lightgreen";
        });

        box.addEventListener("mouseout", () => {
            box.textContent = "Move your mouse here!";
            box.style.backgroundColor = "lightblue";
        });
    </script>

</body>
</html>
